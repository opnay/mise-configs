[tools]
"npm:@github/copilot" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:opencode-ai" = "latest"

"npm:codex-profile" = "latest"

[env]
'_'.file = ["~/.config/mise/.env.mcp", "{{ config_root }}/.env.mcp"]

# Codex [Ctrl+G] to edit chat in VSCode
"VISUAL" = "code -w"

[tasks.codex-provider]
dir = "{{cwd}}"
description = "지정한 model provider로 Codex CLI 실행"
raw = true
usage = 'arg "<provider>" help="Codex config.toml에 등록된 model provider 이름"'
run = 'codex -c "model_provider=\"${usage_provider?}\""'
