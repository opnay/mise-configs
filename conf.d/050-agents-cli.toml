[tools]
"npm:@github/copilot" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@opencode/cli" = { version = "latest", bun_args = "--trust" }

"npm:codex-profile" = "latest"

[tools."github:vercel-labs/fx"]
version = "latest"
os = ["macos/arm64", "macos/x64", "linux/arm64", "linux/x64"]

[tools."github:vercel-labs/fx".platforms]
macos-arm64 = { asset_pattern = "fx-macos-aarch64.tar.gz" }
macos-x64 = { asset_pattern = "fx-macos-x86_64.tar.gz" }
linux-arm64 = { asset_pattern = "fx-linux-aarch64.tar.gz" }
linux-x64 = { asset_pattern = "fx-linux-x86_64.tar.gz" }

[env]
'_'.file = ["~/.config/mise/.env.mcp", "{{ config_root }}/.env.mcp"]

# Codex [Ctrl+G] to edit chat in VSCode
"VISUAL" = "code -w"

[tasks.codex-provider]
dir = "{{cwd}}"
description = "지정한 model provider로 Codex CLI 실행"
raw = true
usage = 'arg "<provider>" help="Codex config.toml에 등록된 model provider 이름"'
run = 'codex -c "model_provider=\"${usage_provider?}\""'
